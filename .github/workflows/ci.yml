name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Lint with flake8 (Python)
        run: |
          # Останавливаем сборку, если есть синтаксические ошибки Python
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Предупреждения (не останавливают сборку)
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Project Structure
        run: |
          echo "Checking essential files..."
          test -f docs/openapi.yaml && echo "OpenAPI spec present."
          test -f docker-compose.yml && echo "docker-compose present."
          test -f backend/app/main.py && echo "main.py present."
          echo "CI Pipeline execution finished successfully."