name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install CPP Linter and Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run C++ Static Analysis (Backend)
        run: |
          echo "Running Cppcheck for C++ backend files..."
          cppcheck --enable=warning,style --inline-suppr backend/ || true

      - name: Check Project Structure
        run: |
          echo "Checking essential files..."
          test -f docs/openapi.yaml && echo "OpenAPI spec present."
          test -f docker-compose.yml && echo "docker-compose present."
          echo "CI Pipeline execution finished successfully."
